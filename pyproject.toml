[project]
name = "bias-dataset"
version = "0.1.0"
description = "Publication-proxy headline dataset for five-class media-bias modelling"
requires-python = ">=3.11"

[project.optional-dependencies]
modeling = [
    "ipykernel==7.3.0",
    "joblib==1.5.3",
    "jupyterlab==4.6.3",
    "matplotlib==3.11.1",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "seaborn==0.13.2",
]

[project.scripts]
bias-collect = "bias_dataset.collect:main"
bias-build = "bias_dataset.build:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
